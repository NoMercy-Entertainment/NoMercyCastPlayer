name: CI

on:
  push:
    branches-ignore:
      - master
      - gh-pages
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, beast-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
