name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - yarn.lock
      - index.html
      - vite.config.ts
      - tsconfig.json
      - tailwind.config.cjs
    branches:
      - master

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, beast-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The self-hosted runner restores node_modules/.bin without the executable bit, so
      # every script that reaches a binary through those shims dies with
      # "permission denied: vue-tsc" before typechecking a single file. Nothing in the
      # repo can prevent that, and it stays invisible until a push touches one of this
      # workflow's path filters — the job last ran green on 2026-08-23 and the bit was
      # gone by the next run. Setting it costs nothing when it is already set.
      - name: Restore executable bit on dependency binaries
        run: chmod -R +x node_modules/.bin

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          cname: cast.nomercy.tv
