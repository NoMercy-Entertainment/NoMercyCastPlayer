<!DOCTYPE html>
<html>

<head>
  <title>NoMercy Cast Player</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>

<body>
  <cast-media-player></cast-media-player>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // **CRITICAL: Enable Android TV app launching**
    const options = new cast.framework.CastReceiverOptions();
    options.customNamespaces = {
      'urn:x-cast:tv.nomercy.app': cast.framework.system.MessageType.JSON
    };

    // Tell Cast to prefer Android TV app over web receiver
    options.androidReceiverCompatible = true;

    // Listen for custom messages from phone
    context.addCustomMessageListener('urn:x-cast:tv.nomercy.app', (customEvent) => {
      console.log('Received custom message:', customEvent.data);
      // Forward to Android TV app if running
    });

    // Start the receiver with Android TV support
    context.start(options);
  </script>
</body>

</html>
