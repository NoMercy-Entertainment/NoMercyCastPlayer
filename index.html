<!DOCTYPE html>
<html lang="">
  <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/favicon.ico" />

      <meta name="viewport"
            content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />

      <title>NoMercy Cast Player</title>

      <!-- Open Graph Metadata -->
      <meta property="og:title" content="NoMercy Cast Player" />
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://examples.nomercy.tv" />

      <meta property="og:site_name" content="NoMercy Cast Player" />
      <meta property="og:locale" content="en_US" />

      <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
      <script src="https://www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

      <script>
          const NAMESPACE = 'urn:x-cast:tv.nomercy.app.intent';

          const context = cast.framework.CastReceiverContext.getInstance();
          const messageBus = context.getMessageBus(NAMESPACE);

          const playerManager = context.getPlayerManager();

          /*
           * Set the player configuration.
           */
          const playbackConfig = new cast.framework.PlaybackConfig();
          playbackConfig.autoResumeDuration = 5;

          /*
           * Configure the CastReceiverOptions.
           */
          const castReceiverOptions = new cast.framework.CastReceiverOptions();
          castReceiverOptions.playbackConfig = playbackConfig;
          castReceiverOptions.skipPlayersLoad = true;
          castReceiverOptions.disableIdleTimeout = true;
          castReceiverOptions.supportedCommands = cast.framework.messages.Command.ALL_BASIC_MEDIA;

          // Listen for deep link strings and open the native app via intent://
          messageBus.onMessage = (event) => {
              const payload = event.data;
              if (!payload || typeof payload !== 'string') return;

              try {
                  // Remove scheme and encode the rest
                  const stripped = payload.replace(/^.*?:\/\//, '');
                  const encoded = encodeURIComponent(stripped);
                  const intentUrl = `intent://${encoded}#Intent;scheme=tv.nomercy.app;package=tv.nomercy.app;end`;

                  // Notify sender we received the message
                  try { messageBus.send(event.senderId, JSON.stringify({ type: 'intent_received', payload })); } catch (e) {}

                  // Attempt to open native app
                  window.location.href = intentUrl;

                  // Fallback after 1s: continue running receiver (or handle payload in-receiver)
                  setTimeout(() => {
                      // e.g. messageBus.broadcast('native-open-attempted');
                      // Optionally: handle payload in the receiver if native app didn't open
                  }, 1000);
              } catch (e) {
                  console.warn('Receiver: failed to open intent', e);
              }
          };

          context.start(castReceiverOptions);

          window.playerManager = playerManager;
      </script>

  </head>
  <body>
    <div id="app" class="w-screen h-screen flex flex-col inset-0 overflow-clip text-white"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
