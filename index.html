<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link href="/favicon.ico" rel="icon" type="image/svg+xml" />

		<meta
			content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
			name="viewport"
		/>

		<title>NoMercy Cast Receiver</title>

		<meta content="NoMercy Cast Receiver" property="og:title" />
		<meta content="website" property="og:type" />
		<meta content="https://cast.nomercy.tv" property="og:url" />
		<meta content="NoMercy" property="og:site_name" />
		<meta content="en_US" property="og:locale" />

		<link rel="preload" as="image" href="/splash.png" />

		<!-- Single Page Apps for GitHub Pages — pre-router decode.
		     MIT License — https://github.com/rafgraph/spa-github-pages
		     Pairs with public/404.html which encodes the requested
		     deep-link into a `?/path/...` redirect to the root. This
		     decoder runs BEFORE main.ts and Vue Router so route guards
		     see the right path on first paint. -->
		<script>
			(function (l) {
				if (l.search[1] === '/') {
					var decoded = l.search.slice(1).split('&').map(function (s) {
						return s.replace(/~and~/g, '&');
					}).join('?');
					window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
				}
			}(window.location));
		</script>

		<!-- Cast Application Framework — required globals -->
		<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
	</head>
	<body class="cast-receiver-root">
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
